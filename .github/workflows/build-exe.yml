name: build-exe

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name BCleaner --icon assets\icon.ico --add-data "assets;assets" --collect-all customtkinter main.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BCleaner.exe
